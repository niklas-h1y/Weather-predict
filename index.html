<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wetter-KI (Autonomes Minuten-Training)</title>
    <style>
        body { background: #09090b; color: #fff; font-family: system-ui, sans-serif; padding: 20px; margin: 0; }
        .card { background: #18181b; padding: 20px; border-radius: 12px; border: 1px solid #27272a; max-width: 400px; margin: 40px auto 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #00ffcc; font-size: 1.4rem; text-align: center; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .val { font-size: 1.5rem; font-weight: bold; color: #00ffcc; font-family: monospace; }
        .label { color: #a1a1aa; font-size: 0.85rem; text-transform: uppercase; }
        .status { text-align: center; color: #ff0055; margin-top: 15px; font-size: 0.9rem; font-weight: bold; }
        .next-info { font-size: 0.8rem; color: #71717a; text-align: center; margin-top: 15px; border-top: 1px solid #27272a; padding-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Autonome KI-Maschine</h2>
    <div class="status" id="status">⚡ Starte System...</div>
    
    <div class="grid">
        <div>
            <div class="label">Trainierte Min.</div>
            <div class="val" id="steps">0</div>
        </div>
        <div>
            <div class="label">KI Score (RL)</div>
            <div class="val" id="score" style="color: #ff0055;">100</div>
        </div>
        <div>
            <div class="label">Echte Temp</div>
            <div class="val" id="actual">--</div>
        </div>
        <div>
            <div class="label">KI Vorhersage</div>
            <div class="val" id="pred">--</div>
        </div>
    </div>

    <div class="next-info" id="nextInfo">Nächstes autonomes Update in: --s</div>
</div>

<script>
    // Historischer Datenstrom
    const mockTemps = [14.5, 15.0, 16.5, 18.2, 20.1, 22.4, 24.1, 25.0, 24.3, 22.1, 18.0, 15.5];
    
    // Speicher-Zustand laden
    let weights = JSON.parse(localStorage.getItem('ki_auto_weights')) || { temp_lag1: 0.5, temp_lag2: 0.3, bias: 0.0 };
    let currentScore = parseInt(localStorage.getItem('ki_auto_score')) || 100;
    let totalSteps = parseInt(localStorage.getItem('ki_auto_steps')) || 0;
    
    // Timer-Variablen für den ununterbrochenen Loop
    let countdownSeconds = 60;

    // Zeige sofort alte Werte beim Starten
    updateDisplayVisuals(
        parseFloat(localStorage.getItem('ki_auto_last_actual')) || 0, 
        parseFloat(localStorage.getItem('ki_auto_last_pred')) || 0
    );

    function runAutonomeKILogik() {
        document.getElementById('status').innerText = "⚡ KI rechnet im Hintergrund...";
        document.getElementById('status').style.color = "#ff0055";

        // Reinforcement Learning Schritt berechnen
        const idx = Math.floor(Math.random() * (mockTemps.length - 2)) + 2;
        const t1 = mockTemps[idx - 1];
        const t2 = mockTemps[idx - 2];
        const actual = mockTemps[idx];

        const prediction = Math.round(((t1 * weights.temp_lag1) + (t2 * weights.temp_lag2) + weights.bias) * 100) / 100;
        const error = actual - prediction;
        const absError = Math.abs(error);

        // Score Vergabe
        let reward = (absError < 0.5) ? 20 : (absError < 1.5 ? 5 : -15);
        currentScore += reward;
        totalSteps += 1;

        // KI Synapsen justieren (Lerneffekt)
        weights.temp_lag1 += 0.01 * error * t1 * 0.01;
        weights.temp_lag2 += 0.01 * error * t2 * 0.01;
        weights.bias += 0.01 * error * 0.1;

        // Werte sichern
        localStorage.setItem('ki_auto_weights', JSON.stringify(weights));
        localStorage.setItem('ki_auto_score', currentScore);
        localStorage.setItem('ki_auto_steps', totalSteps);
        localStorage.setItem('ki_auto_last_actual', actual);
        localStorage.setItem('ki_auto_last_pred', prediction);

        // GUI updaten
        updateDisplayVisuals(actual, prediction);
        
        document.getElementById('status').innerText = "● Daten verarbeitet (Lerneffekt aktiv)";
        document.getElementById('status').style.color = "#00ffcc";
    }

    function updateDisplayVisuals(actual, prediction) {
        document.getElementById('steps').innerText = totalSteps;
        document.getElementById('score').innerText = currentScore;
        document.getElementById('actual').innerText = actual > 0 ? actual.toFixed(1) + "°C" : "--";
        document.getElementById('pred').innerText = prediction > 0 ? prediction.toFixed(1) + "°C" : "--";
    }

    // Die Takt-Schleife (Rattert jede Sekunde für den Countdown)
    setInterval(() => {
        countdownSeconds--;
        
        if (countdownSeconds <= 0) {
            runAutonomeKILogik();
            countdownSeconds = 60; // Setze den Timer zurück auf 1 Minute
        } else {
            document.getElementById('nextInfo').innerText = `Nächstes KI-Update in: ${countdownSeconds}s`;
        }
    }, 1000);

    // Ersten Schritt sofort beim Öffnen ausführen, ohne zu warten
    runAutonomeKILogik();
</script>

</body>
</html>
